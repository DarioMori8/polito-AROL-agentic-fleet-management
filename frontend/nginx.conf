server {
    listen 3000;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redirect all requests to index.html for React Router to resolve pages natively
        try_files $uri $uri/ /index.html;
    }

    # PDF.js loads its worker as an ES module. The default Alpine Nginx MIME
    # table does not recognise .mjs, so serve it explicitly as JavaScript.
    location ~* \.mjs$ {
        root /usr/share/nginx/html;
        default_type application/javascript;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Caching headers optimized for web performance on industrial devices
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        root /usr/share/nginx/html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
