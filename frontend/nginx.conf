server {
    listen 3000;
    server_name localhost;

    # Proxy API calls to the backend container — works from any client IP
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        # Required for SSE (Server-Sent Events) streaming — do NOT buffer
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_buffering off;
        proxy_cache off;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for long-running LLM inference requests
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Redirect all requests to index.html for React Router to resolve pages natively
        try_files $uri $uri/ /index.html;
    }

    # Caching headers optimized for web performance on industrial devices
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        root /usr/share/nginx/html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}