include:
  - langfuse-local/docker-compose.yml

services:

  #  mock-backoffice — stands in for the real ERP/CRM (quotes, orders, docs)

  mock-backoffice:
    build: ./mock-backoffice
    ports:
      - "8003:8003"
    volumes:
      - ./mock-backoffice:/app # dev hot-reload (Dockerfile has --reload)
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  #  agents
  agents:
    build:
      context: ./agents
      additional_contexts:
        contracts: ./shared/contracts
    ports:
      - "8001:8001"
    environment:
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gpt-oss:20b}
      EMBEDDING_MODEL: nomic-embed-text
      MAX_ITERATIONS: "5"
      CHROMA_PATH: ./data/chroma
      MANUALS_PATH: /data/manuals
      DOCS_SERVICE_URL: http://mock-backoffice:8003 # service name
    extra_hosts:
      - "host.docker.internal:host-gateway" # required on Linux, harmless elsewhere
    volumes:
      - ./agents:/app # source + Chroma index (./agents/data) persist here
      - ./data/manuals:/data/manuals:ro # shared manuals volume, read-only here
    depends_on:
      mock-backoffice:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  #  backend 
  backend:
    build:
      context: ./backend
      additional_contexts:
        contracts: ./shared/contracts
    ports:
      - "8000:8000"
    environment:
      MANUALS_AGENT_URL: http://agents:8001
      ORCHESTRATOR_LLM_PROVIDER: ollama
      ORCHESTRATOR_OLLAMA_BASE_URL: http://host.docker.internal:11434
      ORCHESTRATOR_OLLAMA_MODEL: ${ORCHESTRATOR_OLLAMA_MODEL:-gpt-oss:20b}
      ORCHESTRATOR_MAX_ITERATIONS: "5"
      ORCHESTRATOR_NUM_CTX: "4096"
      LANGFUSE_HOST: http://langfuse-web:3000 # reachable by service name via `include`
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?set it in the root .env}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?set it in the root .env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app # dev source mount

    depends_on:
      agents:
        condition: service_healthy
      mock-backoffice:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  #  frontend 
  frontend:
    build: ./frontend
    ports:
      - "8080:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
