# Optional NVIDIA acceleration; requires a working NVIDIA Docker runtime.
services:
  ollama:
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  setup:
    environment:
      SETUP_REQUIRE_GPU: "true"
